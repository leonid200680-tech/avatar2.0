<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Просмотр моделей передач</title>
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@6.1.1/dist/aframe-extras.min.js"></script>
  <script src="https://unpkg.com/aframe-orbit-controls@1.3.0/dist/aframe-orbit-controls.min.js"></script>
</head>
<body style="margin:0">

  <a-scene background="color: #222">
    <a-assets>
      <a-asset-item id="avatarAsset"      src="models/avatar.glb"></a-asset-item>
      <a-asset-item id="gearAsset"        src="models/gear.glb"></a-asset-item>
      <a-asset-item id="wormGearAsset"    src="models/worm_gear.glb"></a-asset-item>
      <a-asset-item id="bevelGearAsset"   src="models/bevel_gear.glb"></a-asset-item>
      <a-asset-item id="rackPinionAsset"  src="models/rack_pinion.glb"></a-asset-item>
      <a-asset-item id="timingBeltAsset"  src="models/timing_belt.glb"></a-asset-item>
      <a-asset-item id="chainDriveAsset"  src="models/chain_drive.glb"></a-asset-item>
    </a-assets>

    <a-entity gltf-model="#avatarAsset" animation-mixer="clip: idle; loop: repeat;"
      position="-3 0 -4" scale="1 1 1"></a-entity>

    <a-entity gltf-model="#gearAsset"       position="0 0 -4" scale="0.5 0.5 0.5"></a-entity>
    <a-entity gltf-model="#wormGearAsset"   position="2 0 -4" scale="0.5 0.5 0.5"></a-entity>
    <a-entity gltf-model="#bevelGearAsset"  position="4 0 -4" scale="0.5 0.5 0.5"></a-entity>
    <a-entity gltf-model="#rackPinionAsset" position="-3 0 -7" scale="0.5 0.5 0.5"></a-entity>
    <a-entity gltf-model="#timingBeltAsset" position="0 0 -7" scale="0.5 0.5 0.5"></a-entity>
    <a-entity gltf-model="#chainDriveAsset" position="2 0 -7" scale="0.5 0.5 0.5"></a-entity>

    <a-entity light="type: ambient; intensity: 0.6"></a-entity>
    <a-entity light="type: directional; intensity: 0.8" position="1 2 1"></a-entity>

    <a-entity camera position="0 1.6 0"
      orbit-controls="target: 1 0 -5; initialPosition: 1 3 3; minDistance: 1; maxDistance: 30">
    </a-entity>

    <a-sky color="#222"></a-sky>
  </a-scene>

</body>
</html>
